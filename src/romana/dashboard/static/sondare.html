<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sondare dispecerat</title>
<style>
:root{--fond:#e7e9e4;--hartie:#f6f7f4;--cerneala:#1f2a33;--gri:#4d5862;--linie:#c9cec7;--albastru:#1d5fa8;--verde:#1d7a47;--rosu:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:minmax(380px,27vw) minmax(0,1fr);background:var(--fond);color:var(--cerneala);font:21px/1.5 "Segoe UI",system-ui,sans-serif}
#ghid{background:var(--hartie);border-right:2px solid var(--linie);padding:28px 26px;overflow:auto;height:100%}
#ghid>*+*{margin-top:16px}
#progres{color:var(--gri);font-size:18px;font-weight:600}
h1{font-size:29px;line-height:1.25;margin:0;font-weight:700}
p{margin:0}
.butoane{display:flex;flex-direction:column;gap:12px}
button{font:600 22px/1.25 "Segoe UI",system-ui,sans-serif;padding:16px 18px;border-radius:8px;border:2px solid var(--cerneala);background:#fff;color:var(--cerneala);cursor:pointer;text-align:left;width:100%}
button:hover{background:#e9eef4}
button.principal{background:var(--albastru);border-color:var(--albastru);color:#fff;text-align:center}
button.principal:hover{background:#174c87}
button.secundar{font-weight:500;font-size:19px;text-align:center;padding:12px 18px}
button:focus-visible{outline:4px solid var(--albastru);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
#scena{position:relative;height:100%;min-width:0;overflow:hidden}
#gol{height:100%;display:grid;place-items:center;text-align:center;color:var(--gri);padding:40px;font-size:24px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#acoperit{position:absolute;inset:0;background:var(--fond);display:none;place-items:center;text-align:center;color:var(--gri);padding:40px;font-size:26px}
#acoperit.vizibil{display:grid}
textarea{font:inherit;width:100%;min-height:150px;padding:12px;border:2px solid var(--cerneala);border-radius:8px}
.stare{padding:10px 14px;border-radius:8px;font-size:19px;color:#fff}
.stare.ok{background:var(--verde)}
.stare.rau{background:var(--rosu)}
#eroare{display:none;padding:12px 14px;border-radius:8px;background:var(--rosu);color:#fff}
</style>
</head>
<body>
<div id="ghid" aria-live="polite"></div>
<div id="scena">
  <div id="gol">Aici se va deschide ecranul de supraveghere.</div>
  <div id="acoperit">Răspundeți în stânga, din ce ați văzut.<br>Ecranul revine imediat.</div>
</div>
<script>
const $=id=>document.getElementById(id);
let pas=null, ocupat=false, ramaYDefilare=0, ultimaDefilare=0;

function fara(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function aldin(s){return fara(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
async function trimite(url,corp){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corp||{})});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function eroare(){
  const e=$("eroare");
  if(e){e.style.display="block";e.textContent="Nu găsesc programul de pe calculator. Chemați, vă rugăm, persoana care v-a invitat."}
}
// Trimite răspunsul o singură dată, chiar dacă butonul e apăsat de două ori.
async function raspunde(corp){
  if(ocupat) return;
  ocupat=true;
  try{ arata(await trimite("/sondare/raspuns",{id:pas.id,...corp})) }catch(e){ eroare() }
  ocupat=false;
}
function rama(){return document.querySelector("#scena iframe")}
function deschide(versiune){
  if(rama()) return;
  const f=document.createElement("iframe");
  f.title="Dispeceratul Piața Romană";
  f.src=`/d/${versiune}/`;
  f.addEventListener("load",()=>{
    const d=f.contentDocument;
    d.addEventListener("click",e=>{
      const b=e.target.closest("button,a,input,select");
      const eticheta=b?(b.textContent||b.id||b.tagName).trim():"în afara butoanelor";
      trimite("/sondare/clic",{eticheta}).catch(()=>{});
    },true);
    f.contentWindow.addEventListener("scroll",()=>{
      const y=f.contentWindow.scrollY, acum=Date.now();
      if(y>ramaYDefilare) ramaYDefilare=y;
      if(acum-ultimaDefilare>1000){ultimaDefilare=acum;trimite("/sondare/defilare",{y:ramaYDefilare}).catch(()=>{})}
    });
  });
  $("scena").insertBefore(f,$("acoperit"));
  $("gol").style.display="none";
}
function inchide(){
  const f=rama();
  if(f) f.remove();
  $("gol").style.display="grid";
  $("gol").textContent="Ecranul de supraveghere e închis.";
}
function buton(text,clasa,fn){
  const b=document.createElement("button");
  b.type="button"; b.textContent=text;
  if(clasa) b.className=clasa;
  b.onclick=fn;
  return b;
}
function arata(p){
  pas=p; ramaYDefilare=0;
  const g=$("ghid"); g.innerHTML="";
  const adauga=(tag,html)=>{const e=document.createElement(tag);e.innerHTML=html;g.appendChild(e);return e};
  if(p.sarcina) adauga("div",`Sarcina ${p.sarcina} din ${p.sarcini}`).id="progres";
  else if(p.numar) adauga("div",fara(p.numar)).id="progres";
  if(p.titlu) adauga("h1",fara(p.titlu));
  (p.text||[]).forEach(t=>adauga("p",aldin(t)));
  if(typeof p.colectare==="boolean"){
    const s=adauga("div",p.colectare?"Colectarea merge: imaginea din dispecerat se va mișca.":"Colectarea nu merge: imaginea din dispecerat nu se va mișca. Opriți-vă aici și spuneți-i lui Claude.");
    s.className="stare "+(p.colectare?"ok":"rau");
  }
  const zona=document.createElement("div"); zona.className="butoane"; g.appendChild(zona);
  if(p.tip==="info") zona.appendChild(buton(p.buton,"principal",()=>raspunde({})));
  else if(p.tip==="alegere"||p.tip==="scara") p.optiuni.forEach(o=>zona.appendChild(buton(o,"",()=>raspunde({valoare:o}))));
  else if(p.tip==="deschide") zona.appendChild(buton(p.buton,"principal",()=>{deschide(p.versiune);raspunde({})}));
  else if(p.tip==="inchide") zona.appendChild(buton(p.buton,"principal",()=>{inchide();raspunde({})}));
  else if(p.tip==="sarcina"){
    zona.appendChild(buton("Am terminat","principal",()=>raspunde({})));
    zona.appendChild(buton("Nu reușesc","secundar",()=>raspunde({nu_reuseste:true})));
  } else if(p.tip==="text"){
    const t=document.createElement("textarea"); t.setAttribute("aria-label",p.titlu); t.maxLength=1000; zona.appendChild(t);
    zona.appendChild(buton(p.buton,"principal",()=>raspunde({valoare:t.value.trim()})));
  } else if(p.tip==="sfarsit") zona.appendChild(buton(p.buton,"principal",async()=>{arata(await trimite("/sondare/urmatorul"))}));
  const er=document.createElement("div"); er.id="eroare"; g.appendChild(er);
  // Pagina reîncărcată: dispeceratul se redeschide dacă pasul îl cere.
  if(p.ecran) deschide(p.versiune); else if(p.tip!=="deschide"&&rama()) inchide();
  $("acoperit").classList.toggle("vizibil",!!p.acoperit);
  g.scrollTop=0;
}
fetch("/sondare/pas",{cache:"no-store"}).then(r=>r.json()).then(arata).catch(()=>{
  $("ghid").innerHTML='<div id="eroare" style="display:block"></div>'; eroare();
});
</script>
</body>
</html>
