<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Browserul oprește orice cerere pe care pagina ar face-o singură: nimic nu pleacă decât dacă persoana apasă „Trimite”. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; frame-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex">
<title>Sondare dispecerat</title>
<style>
:root{--fond:#e7e9e4;--hartie:#f6f7f4;--cerneala:#1f2a33;--gri:#4d5862;--linie:#c9cec7;--albastru:#1d5fa8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:minmax(380px,27vw) minmax(0,1fr);background:var(--fond);color:var(--cerneala);font:21px/1.5 "Segoe UI",system-ui,sans-serif}
#ghid{background:var(--hartie);border-right:2px solid var(--linie);padding:24px 26px;overflow:auto;height:100%}
#ghid>*+*{margin-top:14px}
#ghid.lung p{font-size:18px;line-height:1.4}
#ghid.lung .butoane{position:sticky;bottom:-24px;background:var(--hartie);padding:12px 0}
#progres,#cod{color:var(--gri);font-size:18px;font-weight:600}
h1{font-size:28px;line-height:1.25;margin:0;font-weight:700}
p{margin:0}
.butoane{display:flex;flex-direction:column;gap:12px}
button,.buton{font:600 22px/1.25 "Segoe UI",system-ui,sans-serif;padding:15px 18px;border-radius:8px;border:2px solid var(--cerneala);background:#fff;color:var(--cerneala);cursor:pointer;text-align:left;width:100%;display:block;text-decoration:none}
button:hover,.buton:hover{background:#e9eef4}
button.principal,.buton.principal{background:var(--albastru);border-color:var(--albastru);color:#fff;text-align:center}
button.principal:hover,.buton.principal:hover{background:#174c87}
button.secundar,.buton.secundar{font-weight:500;font-size:19px;text-align:center;padding:12px 18px}
button.oprire{font-weight:400;font-size:16px;text-align:center;padding:6px 10px;border:1px solid var(--linie);color:var(--gri);background:transparent;width:auto;margin-top:26px}
.buton.simplu{display:inline;width:auto;padding:0;border:0;background:none;font:inherit;font-size:17px;color:var(--albastru);text-decoration:underline}
button:focus-visible,.buton:focus-visible{outline:4px solid var(--albastru);outline-offset:2px}
#scena{position:relative;height:100%;min-width:0;overflow:hidden}
#gol{height:100%;display:grid;place-items:center;text-align:center;color:var(--gri);padding:40px;font-size:24px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#acoperit{position:absolute;inset:0;background:var(--fond);display:none;place-items:center;text-align:center;color:var(--gri);padding:40px;font-size:26px}
#acoperit.vizibil{display:grid}
textarea{font:inherit;width:100%;min-height:140px;padding:12px;border:2px solid var(--cerneala);border-radius:8px}
textarea.text-final{font-size:15px;line-height:1.4;height:34vh;border:1px solid var(--linie);background:#fff;resize:vertical}
#nota:empty{display:none}
#nota{font-weight:600}
#indemn{color:var(--gri)}
@media (max-width:899px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,45vh) minmax(0,1fr);font-size:18px}
  #ghid{border-right:0;border-bottom:2px solid var(--linie);padding:14px 16px}
  h1{font-size:22px}
  button,.buton{font-size:18px;padding:10px 12px}
}
</style>
</head>
<body>
<div id="ghid" aria-live="polite"></div>
<div id="scena">
  <div id="gol">Aici se va deschide ecranul de supraveghere.</div>
  <div id="acoperit">Răspundeți în stânga, din ce ați văzut.<br>Ecranul revine imediat.</div>
</div>
<script src="date.js"></script>
<script src="logica.js"></script>
<script src="ecran.js"></script>
</body>
</html>
